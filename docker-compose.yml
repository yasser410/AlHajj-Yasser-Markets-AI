version: '3.8'

services:
  # MongoDB - قاعدة البيانات
  mongodb:
    image: mongo:7.0
    container_name: hajj-markets-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hajj-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - التخزين المؤقت
  redis:
    image: redis:7-alpine
    container_name: hajj-markets-cache
    ports:
      - "6379:6379"
    networks:
      - hajj-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hajj-markets-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/hajj-markets?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-this
      CORS_ORIGIN: http://localhost:3000,http://localhost:8081
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - hajj-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  hajj-network:
    driver: bridge
